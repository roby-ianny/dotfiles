packages:
  common:
    dnf:
      - bat # cat with syntax highlighting
      - nextcloud-client
      - distrobox
      - "@virtualization"
      - gh
      - fastfetch
      - htop
      - gnome-tweaks
      - xclip # needed to paste image vscode extension
      - solaar # logitech mouse/keyboard setup software
      - fuse # needed by AppImages
      - fuse-devel # needed by AppImages
      - steam
    flatpak:
      - it.mijorus.gearlever # manage appimages
      - com.github.tchx84.Flatseal # manage flatpaks
      - md.obsidian.Obsidian # second brain
      - com.mattjakeman.ExtensionManager
      - org.wireshark.Wireshark # for network forensics
      - com.google.AndroidStudio
      - org.localsend.localsend_app
      - com.rustdesk.RustDesk
      - net.ankiweb.Anki # flashcards
      - eu.scarpetta.PDFMixTool
      - net.cozic.joplin_desktop
      - org.videolan.VLC
  desktop:
    flatpak:
      - org.telegram.desktops
      - org.mozilla.thunderbird
      - org.signal.Signal
    dnf:
      - calibre
